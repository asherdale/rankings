name: Reply on X

on:
  push:
    branches: [main]
    paths: ["replies/**"]
  workflow_dispatch:

concurrency:
  group: reply
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Only run code the owner pushed
        if: github.actor != github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trusted=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&event=push&actor=${{ github.repository_owner }}&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$trusted" ]; then echo "Couldn't find the owner's latest push"; exit 1; fi
          git fetch -q --depth=1 origin "$trusted"
          files=$(git diff --no-renames --name-only "$trusted" "${{ github.sha }}")
          changed=$(printf '%s\n' "$files" | grep -v -E '^(results|cards|shots|replies)/' | grep . || true)
          if [ -n "$changed" ]; then echo "Only the owner may change code: $changed"; exit 1; fi
      - run: python3 scripts/x_reply.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Clear sent replies
        if: always()
        run: |
          git config user.name "Rate My Homepage"
          git config user.email "bot@ratemyhomepage.pages.dev"
          git add -A replies
          git diff --cached --quiet && exit 0
          git commit -m "Send replies"
          git push || (git pull --rebase && git push)
