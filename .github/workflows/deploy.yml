name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Only deploy agent changes to results
        if: github.event_name == 'push' && github.actor != github.repository_owner
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -v -E '^(results|cards|shots|replies)/' || true)
          if [ -n "$changed" ]; then echo "Agents may only change results: $changed"; exit 1; fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run build
      - run: npx -y wrangler@4.151.0 pages deploy dist --project-name ratemyhomepage --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
